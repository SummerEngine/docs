name: api-price-sync

# The Summer API pages (api/models, api/reference) render the pinned inputs in
# scripts/api/sources. Prices are never typed by hand: this job reads them from
# production GET /v1/models (and the spec from /v1/openapi.json) with
# scripts/api/sync.mjs, and when the pages change it opens or updates one PR
# from bot/api-price-sync.
#
# Before launch /v1/models answers 404: the job ends green with a notice. Any
# other failure (5xx, bad JSON, a marked-up price list, a failed docs check)
# fails the job, so GitHub emails the team.
#
# Uses GITHUB_TOKEN only. It needs "Allow GitHub Actions to create and approve
# pull requests" on in the repo's Actions settings. PRs opened with
# GITHUB_TOKEN do not start other workflows, so this job runs npm run check.

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: api-price-sync
  cancel-in-progress: false

env:
  BRANCH: bot/api-price-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"

      - name: Pull models and prices from GET /v1/models
        id: sync
        run: |
          set +e
          node scripts/api/sync.mjs
          code=$?
          set -e
          if [ "$code" = 3 ]; then
            echo "::notice::GET /v1/models answers 404: the Summer API is not launched yet. Nothing to sync."
            echo "live=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$code"

      - name: Open or update the price PR
        if: steps.sync.outputs.live != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "The Summer API pages already match GET /v1/models."
            exit 0
          fi
          git status --short | head -50
          npm run check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B "$BRANCH"
          git add -A
          git commit -q -m "Docs: sync Summer API models and prices from /v1/models"
          git push -f origin "$BRANCH"
          body="Models and prices come from production GET https://www.summerengine.com/v1/models (the API reference from /v1/openapi.json), by the api-price-sync workflow (scripts/api/sync.mjs). Do not edit these pages by hand."
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "Docs: Summer API prices from /v1/models" --body "$body" || {
              echo "::error::Could not open the PR. Turn on 'Allow GitHub Actions to create and approve pull requests' in the repo's Actions settings, or open a PR from $BRANCH by hand."
              exit 1
            }
          fi
